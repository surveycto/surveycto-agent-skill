name: Validate and build dev zip

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: python3 -m pip install openpyxl==3.1.5

      - name: Install ffmpeg (ffprobe for audio duration; chunking of long audio)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate XLSX assets
        run: python3 tests/validate_xlsx_assets.py

      - name: Validate doc examples
        run: python3 tests/validate_doc_examples.py

      - name: Test translate/transcribe helpers (offline, no external deps)
        run: |
          python3 tests/test_openai_auth.py
          python3 tests/test_translation.py
          python3 tests/test_transcription.py
          python3 tests/test_setup_env.py
          python3 tests/test_usage_ledger.py
          python3 tests/test_pricing.py

      - name: Test dataset validator
        run: python3 tests/test_dataset_validation.py

      - name: Build zip
        run: |
          zip -r surveycto-skill-dev.zip SKILL.md references assets \
            -x '**/.DS_Store' -x '**/Thumbs.db' \
            -x '**/__pycache__/*' -x '**/*.pyc' -x '**/*.pyo'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: surveycto-skill-dev
          path: surveycto-skill-dev.zip
