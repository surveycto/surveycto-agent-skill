name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: python3 -m pip install openpyxl==3.1.5 packaging

      - name: Validate XLSX assets
        run: python3 tests/validate_xlsx_assets.py

      - name: Test version-policy generator
        run: python3 tests/test_version_policy.py

      - name: Get version from SKILL.md
        id: version
        run: |
          VERSION=$(grep -A5 '^metadata:' SKILL.md | grep 'version:' | sed 's/.*version: *"\?\([^"]*\)"\?/\1/')
          if [ -z "$VERSION" ]; then
            echo "Failed to parse version from SKILL.md" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build version-policy.json
        run: |
          python3 scripts/build_version_policy.py \
            --version "${{ steps.version.outputs.version }}" \
            --source version-policy.source.json \
            --output version-policy.json
          cat version-policy.json

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; will refresh asset only."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist; will create."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        run: |
          zip -r surveycto-skill.zip SKILL.md references assets \
            -x '**/.DS_Store' -x '**/Thumbs.db' \
            -x '**/__pycache__/*' -x '**/*.pyc' -x '**/*.pyo'

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            SurveyCTO Agent Skill v${{ steps.version.outputs.version }}

            Download `surveycto-skill.zip` below and follow the install steps in the [README](https://github.com/surveycto/surveycto-agent-skill/blob/main/README.md) for your agent platform.
          append_body: true
          generate_release_notes: true
          files: |
            surveycto-skill.zip
            version-policy.json
          make_latest: true

      - name: Refresh assets on existing release
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release upload "$TAG" surveycto-skill.zip version-policy.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # Tell the MCP server a new skill release exists so it rebuilds and bakes
      # in the fresh version-policy.json. Cross-org dispatch needs a token with
      # access to scto-dev/scto-assistant-be (a GitHub App installation token or
      # a fine-grained PAT), stored as the MCP_DISPATCH_TOKEN secret. When the
      # secret is absent the step is skipped, so the release never fails on it.
      - name: Notify MCP server of new skill release
        env:
          GH_TOKEN: ${{ secrets.MCP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MCP_DISPATCH_TOKEN not set; skipping cross-repo dispatch."
            exit 0
          fi
          gh api -X POST repos/scto-dev/scto-assistant-be/dispatches \
            -f event_type=skill-released \
            -f "client_payload[version]=$VERSION"
