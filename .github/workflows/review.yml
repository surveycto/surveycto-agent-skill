name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  review:
    if: vars.ANTHROPIC_PR_REVIEW_ENABLED == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest

    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ vars.ANTHROPIC_PR_REVIEW_PROMPT }}
          claude_args: ${{ vars.ANTHROPIC_PR_REVIEW_CLAUDE_ARGS }}